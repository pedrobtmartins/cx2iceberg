# Full example: 3 Catena-X submodels -> Iceberg tables in Athena.
# ${VAR:-default} values come from environment variables.

target:
  database: ${ATHENA_DATABASE:-catenax}
  location: ${ICEBERG_LOCATION:-s3://my-bucket/warehouse}   # each table goes to <location>/<table>/
  temp_path: ${ATHENA_TEMP:-s3://my-bucket/tmp}
  workgroup: ${ATHENA_WORKGROUP:-primary}
  region: ${AWS_REGION:-eu-west-1}

input:
  # Catena-X "value-only" JSON does not carry the semantic id: give it by file name
  # (or --semantic-id on the command line, or input.envelope if it comes wrapped).
  # The examples/data folder also has files for other configurations (pcf_7, pcf_9): ignoring them is a
  # declared decision (counted in the report); without this, a document without a submodel is an error.
  on_unmatched: skip
  semantic_id_map:
    "*serial_part*": urn:samm:io.catenax.serial_part:3.0.0#SerialPart
    "*single_level_bom*": urn:samm:io.catenax.single_level_bom_as_built:3.0.0#SingleLevelBomAsBuilt
    "*pcf_demo*": urn:samm:io.catenax.pcf:7.0.0#Pcf

defaults:
  metadata_columns: true      # cx_source_file, cx_semantic_id, cx_ingested_at, cx_record_hash
  on_error: fail              # fail | null | skip_row

submodels:

  # ------------------------------------------------------------------ SerialPart: explicit rules
  - name: serial_part
    match:
      semantic_id: "urn:samm:io.catenax.serial_part:3.*"
    document_id:              # the same UUID in every table of this submodel -> JOIN between them
      column: serial_part_uuid
      from: catenaXId         # deterministic: the same digital twin always gives the same UUID
    common_columns:           # go into every table of this submodel
      catenax_id: { path: $root.catenaXId, transform: urn_suffix, required: true }
    tables:
      - name: serial_part
        mode: merge
        keys: [catenax_id]
        partition_by: [manufacturing_country]
        columns:
          part_instance_id: "localIdentifiers[?key=partInstanceId].value | first"
          manufacturer_bpnl: { path: "localIdentifiers[?key=manufacturerId].value", transform: first }
          van: { path: "localIdentifiers[?key=van].value", transform: first }
          manufacturing_date: { path: manufacturingInformation.date, type: timestamp }
          manufacturing_year: { path: manufacturingInformation.date, transform: year, type: int }
          manufacturing_country: manufacturingInformation.country
          manufacturer_part_id: partTypeInformation.manufacturerPartId
          customer_part_id: { path: partTypeInformation.customerPartId, default: "N/A" }
          part_name: { paths: [partTypeInformation.nameAtCustomer, partTypeInformation.nameAtManufacturer] }
          part_label: { template: "{partTypeInformation.manufacturerPartId} / {partTypeInformation.nameAtManufacturer}" }
          site_ids: { path: "manufacturingInformation.sites[*].catenaXsiteId", type: "array<string>" }
          n_local_identifiers: { path: localIdentifiers, transform: count, type: int }
          local_identifiers_json: { path: localIdentifiers, type: json }

      - name: serial_part_local_identifiers
        explode: localIdentifiers
        mode: append
        replace_by: [catenax_id]   # deletes the old rows of the same digital twin before inserting
        keys: [catenax_id, key]
        columns:
          key: { path: key, transform: snake_case }
          value: value

      - name: serial_part_classification
        explode: partTypeInformation.partClassification
        keep_empty: false
        keys: [catenax_id, classification_id]
        mode: merge
        columns:
          classification_id: classificationID
          standard: classificationStandard
          description: { path: classificationDescription, transform: [trim, { substring: [0, 200] }] }

  # ------------------------------------------------------------------ BOM: explode + filters + units
  - name: single_level_bom_as_built
    match:
      semantic_id: "urn:samm:io.catenax.single_level_bom_as_built:*"
    tables:
      - name: bom_as_built_edges
        explode: childItems
        mode: merge
        keys: [parent_id, child_id]
        partition_by: ["day(created_on)"]
        columns:
          parent_id: { path: $root.catenaXId, transform: urn_suffix }
          child_id: { path: catenaXId, transform: urn_suffix }
          position: { path: $index, type: int }
          quantity_value: { path: quantity.value, type: double }
          quantity_unit: { path: quantity.unit, transform: urn_suffix }
          quantity_kg: { path: quantity, transform: { unit_convert: { to: kilogram } }, on_error: "null", type: double }
          has_alternatives: { path: hasAlternatives, type: boolean }
          business_partner: { path: businessPartner, transform: upper }
          created_on: { path: createdOn, type: timestamp }
          last_modified_on: { paths: [lastModifiedOn, createdOn], type: timestamp }
          edge_id: { template: "{$root.catenaXId}|{catenaXId}", transform: uuid5 }

      - name: bom_as_built_alternatives
        explode: childItems
        where: { path: hasAlternatives, op: eq, value: true }
        columns:
          parent_id: { path: $root.catenaXId, transform: urn_suffix }
          child_id: { path: catenaXId, transform: urn_suffix }

  # ------------------------------------------------------------------ PCF: all automatic
  - name: pcf
    match:
      semantic_id: "urn:samm:io.catenax.pcf:7.*"   # the model version below
    model:
      # with the schema, the child tables are ALL the model's lists, whether or not the batch has data: a document
      # whose list became empty deletes that list's old rows (without it, children: batch would be needed)
      schema: schemas/pcf_7.0.0-schema.json
    validate: off              # data/pcf_demo.json is a reduced example, without all the fields 7.0.0 requires
    document_id: true          # no 'from': UUID from the document's content
    defaults:
      mode: merge
    auto_normalize:
      table_prefix: pcf
      id_path: id            # the document's key (Catena-X usually: catenaXId)
      id_column: pcf_id
